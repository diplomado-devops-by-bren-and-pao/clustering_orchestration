apiVersion: apps/v1
kind: Deployment
metadata:
  name: saludos-frontend
  namespace: brendisas
  labels:
    app: saludos
    component: frontend
    environment: development
  annotations:
    description: "Deployment del frontend de Saludos"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saludos
      component: frontend
  template:
    metadata:
      labels:
        app: saludos
        component: frontend
    spec:
      nodeSelector:
        environment: development
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: saludos
              component: frontend
      containers:
        - name: frontend
          image: brendisas/frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://saludos-backend:5000"
            - name: BACKEND_HOST
              value: "saludos-backend"
            - name: BACKEND_PORT
              value: "5000"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
