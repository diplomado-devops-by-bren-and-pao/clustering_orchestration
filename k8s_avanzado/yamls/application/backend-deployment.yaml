apiVersion: apps/v1
kind: Deployment
metadata:
  name: saludos-backend
  namespace: brendisas
  labels:
    app: saludos
    component: backend
    environment: development
  annotations:
    description: "Deployment del backend de Saludos"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saludos
      component: backend
  template:
    metadata:
      labels:
        app: saludos
        component: backend
    spec:
      nodeSelector:
        environment: development
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: saludos
              component: backend
      containers:
        - name: backend
          image: brendisas/backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: saludos-config
            - secretRef:
                name: saludos-db-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
